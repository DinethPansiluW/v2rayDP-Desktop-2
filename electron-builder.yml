appId: com.v2raydp.desktop
productName: v2rayDP Desktop
copyright: Copyright © 2026 Dineth Pansilu Wickramasinghe

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.png
  - public/app_logo.png
  - public/app_logo_gray.png
  - package.json

extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: public/app_logo.png
    to: app_logo.png
  - from: public/app_logo_gray.png
    to: app_logo_gray.png

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  signAndEditExecutable: true
  requestedExecutionLevel: requireAdministrator

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: v2rayDP Desktop
  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico

portable:
  artifactName: v2rayDP-Desktop-Portable-${version}.exe
